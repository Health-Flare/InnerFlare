name: Android build & release

on:
  # Manual "get me an APK now" run — download the artifact and sideload it.
  workflow_dispatch:
  push:
    branches: [main]
    # Signed release build for the Play Store, triggered by a version tag.
    tags:
      - "v*.*.*"

jobs:
  debug-apk:
    name: Debug APK (sideload build)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: inner-flare-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  release-bundle:
    name: Signed release (AAB + APK)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Check signing secrets are configured
        run: |
          missing=()
          [[ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]] && missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]] && missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]] && missing+=(ANDROID_KEY_ALIAS)
          [[ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]] && missing+=(ANDROID_KEY_PASSWORD)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing repo secrets: ${missing[*]}" >&2
            echo "See docs/deployment/android-release.md for how to generate and add them." >&2
            exit 1
          fi

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Build release APK
        run: flutter build apk --release

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: inner-flare-release-bundle
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
