name: Android build & release

on:
  # Manual "get me an APK now" run: download the artifact and sideload it.
  workflow_dispatch:
  push:
    # Signed release build, GitHub Release, and Play internal-track upload,
    # triggered by a version tag.
    tags:
      - "v*.*.*"

jobs:
  debug-apk:
    name: Debug APK (sideload build)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: inner-flare-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  release-bundle:
    name: Signed release (AAB + APK)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Check signing secrets are configured
        run: |
          missing=()
          [[ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]] && missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]] && missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]] && missing+=(ANDROID_KEY_ALIAS)
          [[ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]] && missing+=(ANDROID_KEY_PASSWORD)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing repo secrets: ${missing[*]}" >&2
            echo "See docs/deployment/android-release.md for how to generate and add them." >&2
            exit 1
          fi

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Build release APK
        run: flutter build apk --release

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v7
        with:
          name: inner-flare-release-bundle
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

      # Same approach as HealthFlare's release-playstore.yaml: upload the
      # signed AAB to the Play *internal testing* track. Promotion to
      # production stays a deliberate step in Play Console.
      # Each upload needs a higher versionCode (the "+N" in pubspec.yaml's
      # `version:`) than any build already on Play, or Play rejects it.
      # Placed after the GitHub release so a Play failure never costs the
      # release assets.
      - name: Check Play service account secret is configured
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "Missing repo secret: PLAY_SERVICE_ACCOUNT_JSON" >&2
            echo "See docs/deployment/android-release.md for how to set it up." >&2
            exit 1
          fi

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.healthflare.app.innerflare
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
