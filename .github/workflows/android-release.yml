name: Android build & release

on:
  # Manual "get me an APK now" run: download the artifact and sideload it.
  # Release mode, signed with a test key (see the sideload-apk job).
  workflow_dispatch:
  push:
    # Signed release build, GitHub Release, and Play internal-track upload,
    # triggered by a version tag.
    tags:
      - "v*.*.*"

# Least privilege by default; a job that needs more asks for it itself.
permissions:
  contents: read

env:
  # Pinned so a release build is reproducible and a bad stable push can't
  # land in a signed build unreviewed. Bump deliberately, in one PR, across
  # ci.yml, android-release.yml and ios-release.yml together.
  FLUTTER_VERSION: '3.47.7'

jobs:
  # Release mode, not --debug: a debug build is android:debuggable and carries
  # INTERNET (android/app/src/debug/AndroidManifest.xml), so `adb run-as` or an
  # attached debugger could read the app sandbox and lift the SQLCipher key
  # from memory. A sideloaded build should be as hard to pick apart as the
  # store one. It's signed with a separate *test* key, never the upload key,
  # so anyone handed this APK holds nothing that can publish to Play.
  sideload-apk:
    name: Sideload APK (release mode, test key)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Check test signing secrets are configured
        run: |
          missing=()
          [[ -z "${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}" ]] && missing+=(ANDROID_TEST_KEYSTORE_BASE64)
          [[ -z "${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}" ]] && missing+=(ANDROID_TEST_KEYSTORE_PASSWORD)
          [[ -z "${{ secrets.ANDROID_TEST_KEY_ALIAS }}" ]] && missing+=(ANDROID_TEST_KEY_ALIAS)
          [[ -z "${{ secrets.ANDROID_TEST_KEY_PASSWORD }}" ]] && missing+=(ANDROID_TEST_KEY_PASSWORD)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing repo secrets: ${missing[*]}" >&2
            echo "See docs/deployment/android-release.md (\"Sideload builds\")." >&2
            exit 1
          fi

      - name: Decode test signing key
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_TEST_KEYSTORE_BASE64" | base64 -d > android/app/test-keystore.jks

      - name: Write key.properties
        env:
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_TEST_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_TEST_KEY_PASSWORD
          keyAlias=$ANDROID_TEST_KEY_ALIAS
          storeFile=test-keystore.jks
          EOF

      - name: Build release-mode APK
        run: flutter build apk --release

      - name: No network permissions in the release APK
        run: ./scripts/check_release_permissions.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Remove signing material
        if: always()
        run: rm -f android/app/test-keystore.jks android/key.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: inner-flare-sideload-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  release-bundle:
    name: Signed release (AAB + APK)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Only for "Check Play upload result" below, to fetch this job's own
      # in-progress log and distinguish a known-benign Play rejection from
      # a real upload failure.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Check signing secrets are configured
        run: |
          missing=()
          [[ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]] && missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]] && missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]] && missing+=(ANDROID_KEY_ALIAS)
          [[ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]] && missing+=(ANDROID_KEY_PASSWORD)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing repo secrets: ${missing[*]}" >&2
            echo "See docs/deployment/android-release.md for how to generate and add them." >&2
            exit 1
          fi

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Build release APK
        run: flutter build apk --release

      - name: No network permissions in the release APK
        run: ./scripts/check_release_permissions.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: inner-flare-release-bundle
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

      # Same approach as HealthFlare's release-playstore.yaml: upload the
      # signed AAB to the Play *internal testing* track. Promotion to
      # production stays a deliberate step in Play Console.
      # Each upload needs a higher versionCode (the "+N" in pubspec.yaml's
      # `version:`) than any build already on Play, or Play rejects it.
      # Placed after the GitHub release so a Play failure never costs the
      # release assets.
      - name: Check Play service account secret is configured
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "Missing repo secret: PLAY_SERVICE_ACCOUNT_JSON" >&2
            echo "See docs/deployment/android-release.md for how to set it up." >&2
            exit 1
          fi

      - name: Upload to Play Store (internal track)
        id: play_upload
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.healthflare.app.innerflare
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # continue-on-error above means a real Play failure wouldn't fail
      # the job on its own; this step is what actually decides that. It
      # exists for exactly one scenario: re-running this job against a
      # version that's already on the internal track (e.g. retagging a
      # release to retry the unrelated iOS job), where Play rejects the
      # upload with "Version code N has already been used" even though
      # nothing is actually wrong, see
      # https://github.com/Health-Flare/InnerFlare/pull/142. There's no
      # structured error output from the action to check directly, so
      # this re-reads this same job's own (already-written) log for that
      # step and matches the exact Play error text. Any other failure
      # (bad credentials, a real upload problem) doesn't match and still
      # fails the job.
      - name: Check Play upload result
        if: always() && steps.play_upload.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          job_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.name == "Signed release (AAB + APK)") | .id')
          if [[ -z "$job_id" ]]; then
            echo "Could not find this job's own id to check its log; failing closed." >&2
            exit 1
          fi
          log=$(gh api --allow-escape-sequences "repos/${{ github.repository }}/actions/jobs/$job_id/logs")
          if echo "$log" | grep -qE 'Version code [0-9]+ has already been used\.'; then
            echo "::warning::Play rejected this upload because version code" \
              "$(echo "$log" | grep -oE 'Version code [0-9]+ has already been used' | head -1 | grep -oE '[0-9]+')" \
              "is already on the internal track. Treating as already-released," \
              "not a failure; confirm in Play Console if in doubt."
          else
            echo "Play upload failed for a reason other than an already-used" \
              "version code. Not tolerating this one; see the upload step's" \
              "own log above." >&2
            exit 1
          fi
