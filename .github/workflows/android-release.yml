name: Android build & release

on:
  # Manual "get me an APK now" run: download the artifact and sideload it.
  # Release mode, signed with a test key (see the sideload-apk job).
  workflow_dispatch:
  push:
    # Signed release build, GitHub Release, and Play internal-track upload,
    # triggered by a version tag.
    tags:
      - "v*.*.*"

# Least privilege by default; a job that needs more asks for it itself.
permissions:
  contents: read

env:
  # Pinned so a release build is reproducible and a bad stable push can't
  # land in a signed build unreviewed. Bump deliberately, in one PR, across
  # ci.yml, android-release.yml and ios-release.yml together.
  FLUTTER_VERSION: '3.47.7'

jobs:
  # Release mode, not --debug: a debug build is android:debuggable and carries
  # INTERNET (android/app/src/debug/AndroidManifest.xml), so `adb run-as` or an
  # attached debugger could read the app sandbox and lift the SQLCipher key
  # from memory. A sideloaded build should be as hard to pick apart as the
  # store one. It's signed with a separate *test* key, never the upload key,
  # so anyone handed this APK holds nothing that can publish to Play.
  sideload-apk:
    name: Sideload APK (release mode, test key)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Check test signing secrets are configured
        run: |
          missing=()
          [[ -z "${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}" ]] && missing+=(ANDROID_TEST_KEYSTORE_BASE64)
          [[ -z "${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}" ]] && missing+=(ANDROID_TEST_KEYSTORE_PASSWORD)
          [[ -z "${{ secrets.ANDROID_TEST_KEY_ALIAS }}" ]] && missing+=(ANDROID_TEST_KEY_ALIAS)
          [[ -z "${{ secrets.ANDROID_TEST_KEY_PASSWORD }}" ]] && missing+=(ANDROID_TEST_KEY_PASSWORD)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing repo secrets: ${missing[*]}" >&2
            echo "See docs/deployment/android-release.md (\"Sideload builds\")." >&2
            exit 1
          fi

      - name: Decode test signing key
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_TEST_KEYSTORE_BASE64" | base64 -d > android/app/test-keystore.jks

      - name: Write key.properties
        env:
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_TEST_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_TEST_KEY_PASSWORD
          keyAlias=$ANDROID_TEST_KEY_ALIAS
          storeFile=test-keystore.jks
          EOF

      - name: Build release-mode APK
        run: flutter build apk --release

      - name: Remove signing material
        if: always()
        run: rm -f android/app/test-keystore.jks android/key.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: inner-flare-sideload-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  release-bundle:
    name: Signed release (AAB + APK)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Check signing secrets are configured
        run: |
          missing=()
          [[ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]] && missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]] && missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]] && missing+=(ANDROID_KEY_ALIAS)
          [[ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]] && missing+=(ANDROID_KEY_PASSWORD)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing repo secrets: ${missing[*]}" >&2
            echo "See docs/deployment/android-release.md for how to generate and add them." >&2
            exit 1
          fi

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Build release APK
        run: flutter build apk --release

      # arm64-only APK for IzzyOnDroid, which caps a file at about 30 MB
      # (the universal APK is ~70 MB). abiFilters drops the other ABIs'
      # SQLCipher libraries too; the versionCode stays the same, so it is
      # the same release as the universal APK. Built after the universal one,
      # so copy that aside first: both write app-release.apk.
      - name: Build arm64 APK
        run: |
          mkdir -p build/release-assets
          cp build/app/outputs/flutter-apk/app-release.apk build/release-assets/app-release.apk
          flutter build apk --release --target-platform android-arm64 --android-project-arg=abiFilters=arm64-v8a
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/release-assets/innerflare-${GITHUB_REF_NAME}-arm64-v8a.apk"
          ls -l build/release-assets

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: inner-flare-release-bundle
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/release-assets/*.apk
          retention-days: 90

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/release-assets/*.apk
          generate_release_notes: true

      # Same approach as HealthFlare's release-playstore.yaml: upload the
      # signed AAB to the Play *internal testing* track. Promotion to
      # production stays a deliberate step in Play Console.
      # Each upload needs a higher versionCode (the "+N" in pubspec.yaml's
      # `version:`) than any build already on Play, or Play rejects it.
      # Placed after the GitHub release so a Play failure never costs the
      # release assets.
      - name: Check Play service account secret is configured
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "Missing repo secret: PLAY_SERVICE_ACCOUNT_JSON" >&2
            echo "See docs/deployment/android-release.md for how to set it up." >&2
            exit 1
          fi

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.healthflare.app.innerflare
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
