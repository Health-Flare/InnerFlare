name: PR checks

# Always runs on every PR to main, regardless of which paths changed — unlike
# ci.yml's path-filtered jobs, these are metadata/hygiene checks that should
# never be silently skipped (and skipped path-filtered jobs can't be required
# status checks, since GitHub leaves them permanently pending on PRs that
# don't touch a matching path).

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    name: PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a filled-in description
        uses: actions/github-script@v9
        with:
          script: |
            const body = (context.payload.pull_request.body || '');
            const stripped = body.replace(/<!--[\s\S]*?-->/g, '').trim();
            if (stripped.length < 10) {
              core.setFailed(
                'PR description is empty (or just the unfilled template). ' +
                'Describe what changed and why before merging.'
              );
            }

  conflict-markers:
    name: No leftover conflict markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan changed files for merge-conflict markers
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          found=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if grep -nE '^(<{7}|={7}|>{7})( |$)' -- "$file"; then
              echo "::error file=$file::Merge-conflict marker found"
              found=1
            fi
          done < <(git diff --name-only --diff-filter=d "$base" "$head")
          exit "$found"
