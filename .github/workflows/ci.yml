name: CI

# No top-level `paths:` filter: `analyze`/`test` are gated per-job below
# instead, so this workflow (and its `required` gate job) always runs and
# can be used as a required branch-protection status check. A workflow-level
# paths filter would make the whole run (required job included) never
# start for a PR that doesn't touch a matching path, which leaves a
# required status check permanently "Expected" and blocks the merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; a job that needs more asks for it itself.
permissions:
  contents: read

env:
  # Pinned so a release build is reproducible and a bad stable push can't
  # land in a signed build unreviewed. Bump deliberately, in one PR, across
  # ci.yml, android-release.yml and ios-release.yml together.
  FLUTTER_VERSION: '3.47.7'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # paths-filter lists a PR's changed files through the API on
    # pull_request events.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'scripts/check_no_network_urls.sh'
              - '.url-scan-ignore'
              - '.github/workflows/ci.yml'
            # Anything that can change what Gradle builds: the Android
            # project itself (Gradle wrapper, AGP/Kotlin plugin versions)
            # and plugin packages, which bring their own native Android code.
            android:
              - 'android/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.github/workflows/ci.yml'

  analyze:
    name: Format & analyze
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Offline-only URL scan
        run: ./scripts/check_no_network_urls.sh

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  # Format/analyze/test never touch Gradle, so without this a Gradle or
  # Android Gradle Plugin bump (android/** only) skips every real check and
  # still goes green. Gradle 9.6+ with AGP 8.x, or AGP 9 with Gradle 8.x,
  # fails at plugin apply time: this job is what catches that.
  android-build:
    name: Android build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Build debug APK
        run: flutter build apk --debug

  required:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [analyze, test, android-build]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          for result in "${{ needs.analyze.result }}" "${{ needs.test.result }}" "${{ needs.android-build.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required CI job did not pass."
              exit 1
            fi
          done
          echo "OK (analyze: ${{ needs.analyze.result }}, test: ${{ needs.test.result }}, android-build: ${{ needs.android-build.result }})"
