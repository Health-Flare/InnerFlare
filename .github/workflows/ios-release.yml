name: iOS build & release

on:
  # Manual "does the iOS build still work" check — no signing, no secrets
  # needed. Produces a simulator-only .app, not something installable on
  # a real device (iOS requires signing for that even in debug).
  workflow_dispatch:
  push:
    # Signed release build for TestFlight / App Store, triggered by a
    # version tag, mirroring android-release.yml.
    tags:
      - "v*.*.*"

jobs:
  simulator-build:
    name: Simulator build (sideload-free smoke test)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Build for iOS Simulator
        run: flutter build ios --simulator --debug

      - uses: actions/upload-artifact@v7
        with:
          name: inner-flare-simulator-build
          path: build/ios/iphonesimulator/Runner.app
          retention-days: 14

  release-ipa:
    name: Signed release (IPA + App Store Connect upload)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Check signing secrets are configured
        run: |
          missing=()
          [[ -z "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" ]] && missing+=(APPLE_CERTIFICATE_BASE64)
          [[ -z "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ]] && missing+=(APPLE_CERTIFICATE_PASSWORD)
          [[ -z "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" ]] && missing+=(APPLE_PROVISIONING_PROFILE_BASE64)
          [[ -z "${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}" ]] && missing+=(APPLE_PROVISIONING_PROFILE_NAME)
          [[ -z "${{ secrets.APPLE_TEAM_ID }}" ]] && missing+=(APPLE_TEAM_ID)
          [[ -z "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" ]] && missing+=(APP_STORE_CONNECT_KEY_ID)
          [[ -z "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" ]] && missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [[ -z "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" ]] && missing+=(APP_STORE_CONNECT_API_KEY_BASE64)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing repo secrets: ${missing[*]}" >&2
            echo "See docs/deployment/ios-release.md for how to generate and add them." >&2
            exit 1
          fi

      - name: Import signing certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_DIR/inner_flare.mobileprovision"

      - name: Write export options plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.healthflare.app.innerflare</key>
              <string>$APPLE_PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build release archive
        run: |
          flutter build ipa --release \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Set up App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/inner_flare.mobileprovision"
          rm -rf "$HOME/.appstoreconnect/private_keys"

      - uses: actions/upload-artifact@v7
        with:
          name: inner-flare-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 90
