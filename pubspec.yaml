name: inner_flare
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.5.1+9

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  # Variable-size grid cells for the dashboard (docs/features/
  # dashboard_grid_layout.feature): StaggeredGrid's spannable-cell mode,
  # not its organic masonry mode. Zero dependencies of its own; last
  # released a while ago, but it only composes stable Flutter layout
  # primitives, so that's low risk (see the PR that added this).
  flutter_staggered_grid_view: ^0.7.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  file_picker: ^13.0.0
  flutter_local_notifications: ^23.0.0
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.2
  riverpod: ^3.4.3
  sqflite_common: ^2.5.8
  cryptography: ^2.9.0
  # Hands a user-tapped link to the system browser. Not a network client:
  # release builds still request no internet permission, and the only URL
  # (the privacy policy) is listed in .url-scan-ignore.
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

# android_file_picker 2.2.0 is broken: its own bundled Kotlin source
# references FilePickerDelegate members file_picker 13.4.0 doesn't wire
# up, so :android_file_picker:compileDebugKotlin fails on every build.
# Pin to the last version file_picker's own changelog documents as
# compatible (13.3.3: "Requires android_file_picker 2.1.5") until
# upstream fixes the resolution. Remove this once file_picker's
# constraint on android_file_picker excludes the broken release.
dependency_overrides:
  android_file_picker: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1
  sqflite_common_ffi: ^2.4.0+3
  flutter_launcher_icons: ^0.14.4
  local_auth_platform_interface: ^1.1.0
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  assets:
    - assets/images/
    - assets/images/brand/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Italic.ttf
          style: italic
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-SemiBoldItalic.ttf
          weight: 600
          style: italic

flutter_launcher_icons:
  image_path: "docs/brand/app-icons/innerflare-app-icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "docs/brand/app-icons/innerflare-app-icon-dark.png"
  adaptive_icon_background: "#D2546E"
  adaptive_icon_foreground: "docs/brand/app-icons/innerflare-android-foreground.png"
  adaptive_icon_monochrome: "docs/brand/app-icons/innerflare-android-monochrome.png"
  macos:
    generate: true
    image_path: "docs/brand/app-icons/innerflare-app-icon.png"
  windows:
    generate: true
    image_path: "docs/brand/app-icons/innerflare-app-icon.png"
  web:
    generate: true
    image_path: "docs/brand/app-icons/innerflare-app-icon.png"
    background_color: "#FBF7F2"
    theme_color: "#FBF7F2"
