#
# Still blocking a real submission:
#   - `commit:` below is a placeholder. F-Droid requires a full commit
#     hash, NOT a tag or branch name ("Don't use branch name or tag name.
#     The full commit hash should be used." — Build Metadata Reference).
#     Fill this in once issue #29 settles which tagged commit is "v1" and
#     issue #34's spike confirms it actually builds.
#   - `srclibs: flutter@<version>` needs a *pinned* Flutter version, not
#     "stable" — this repo's CI (.github/workflows/*.yml) currently uses
#     `channel: stable` (subosito/flutter-action), which floats. Pin an
#     exact version here (e.g. whatever `flutter --version` reports when
#     the release tag is cut) rather than guessing one now, since F-Droid
#     needs the same version every rebuild.
#   - The `prebuild`/`build` shell steps below are adapted from a real,
#     currently-building F-Droid Flutter app (de.wger.flutter) rather than
#     invented from scratch, but they're still unverified against this
#     app's actual dependency set and Android/Gradle config until the
#     issue #34 spike runs them for real.
#   - This app builds a *single* universal APK today (see
#     android-release.yml); the recipe below keeps that instead of
#     `--split-per-abi`, which the upstream template uses. Revisit if we
#     ever move to split APKs for the Play release too.

Categories:
  - Health
Summary: Offline, encrypted menstrual cycle tracker
Description: |
  Inner Flare is a menstrual cycle tracking companion. It works fully
  offline: no network calls, no accounts, no cloud sync. All data stays
  on-device in a SQLite database encrypted at rest, unlocked with
  biometrics where the device supports it. Not a medical device; no
  diagnostic claims.

License: GPL-3.0-or-later
SourceCode: https://github.com/Health-Flare/InnerFlare
IssueTracker: https://github.com/Health-Flare/InnerFlare/issues

AutoName: Inner Flare

RepoType: git
Repo: https://github.com/Health-Flare/InnerFlare.git

Builds:
  # PLACEHOLDER: versionName/versionCode must match the pubspec.yaml
  # version+build of whichever tag issue #29 settles on — '1.0.0'/1 is
  # just the earliest shipped tag, not a confirmed choice.
  - versionName: '1.0.0'
    versionCode: 1
    # PLACEHOLDER: full commit hash of the tag chosen in issue #29, not the
    # tag name itself (F-Droid explicitly disallows tag/branch names here).
    commit: 0000000000000000000000000000000000000000
    subdir: .
    sudo:
      - apt-get update
      - apt-get install -y curl git unzip xz-utils
    # Flutter SDK via srclib, following the current official template
    # rather than a raw `curl`/preinstalled-`flutter` assumption (the
    # previous draft's approach — unverified and likely wrong per the
    # fdroiddata Flutter build template).
    srclibs:
      - flutter@stable  # PLACEHOLDER: pin to an exact version, e.g. flutter@3.47.2
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - $$flutter$$/bin/cache
    scandelete:
      - $$flutter$$
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    output: build/app/outputs/flutter-apk/app-release.apk

AutoUpdateMode: None
UpdateCheckMode: Tags
# PLACEHOLDER — see the Builds: entry above; must match once issue #29 is settled.
CurrentVersion: '1.0.0'
CurrentVersionCode: 1
